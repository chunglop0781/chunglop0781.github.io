<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giới Thiệu Bản Thân</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      max-width: 700px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      color: #333;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="https://via.placeholder.com/150" alt="Ảnh đại diện">

    <h1>Xin chào, tôi là Nguyễn Văn A</h1>

    <p>
      Tôi là một người yêu thích công nghệ và lập trình web.
      Hiện tại tôi đang học HTML, CSS và JavaScript để trở thành Front-end Developer.
    </p>

    <p>
      Sở thích của tôi là nghe nhạc, chơi game và tìm hiểu công nghệ mới.
    </p>

    <a href="#" class="btn">Liên hệ với tôi</a>
  </div>

</body>
</html>
